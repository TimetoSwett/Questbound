name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nextjs_space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextjs_space
    env:
      # Placeholders only. Not credentials, and not repo secrets.
      #
      # `next build` on current main succeeds with none of these set: every
      # route is dynamic, Prisma is constructed but not queried, and NextAuth
      # does not require a secret until a request. They are set so the job
      # does not depend on secrets and matches the vars the app actually reads.
      #
      # Keep "prod" and "hpminioma" out of DATABASE_URL. test:library and
      # test:companions exit 1 if they see those substrings. The test step
      # unsets DATABASE_URL so those scripts stay on their DB-free path
      # instead of opening a client against this placeholder.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/questbound_ci
      # next-auth/lib/env.js: AUTH_SECRET, then NEXTAUTH_SECRET.
      AUTH_SECRET: ci-placeholder-not-a-secret
      NEXTAUTH_SECRET: ci-placeholder-not-a-secret
      # Optional. auth.ts sets trustHost: true, so a URL is not required to build.
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # engines.node and next are >=20.9.0. @types/node is 22.
          # Pin the current 22 LTS that satisfies that floor (README: Node 20+).
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps; then
            echo "Installed with npm ci --legacy-peer-deps"
          else
            echo "::warning::npm ci failed. package-lock.json may have drifted. Falling back to npm install --legacy-peer-deps."
            npm install --legacy-peer-deps
          fi

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: DB-free model and unit tests
        run: |
          # The job placeholder would make test:library and test:companions
          # open Prisma, and REALTIME_BASE would make test:realtime hit a server.
          unset DATABASE_URL
          unset REALTIME_BASE
          unset BASE
          mapfile -t names < <(node -e '
            const scripts = require("./package.json").scripts || {};
            const skip = new Set(["test:cp-guardrails"]);
            for (const name of Object.keys(scripts)) {
              if (name.startsWith("test:") && !skip.has(name)) console.log(name);
            }
          ')
          if [ "${#names[@]}" -eq 0 ]; then
            echo "No DB-free test scripts found"
            exit 1
          fi
          for name in "${names[@]}"; do
            echo "::group::${name}"
            npm run "$name"
            echo "::endgroup::"
          done

      - name: npm test
        run: |
          unset DATABASE_URL
          if node -e 'const scripts = require("./package.json").scripts || {}; process.exit(scripts.test ? 0 : 1)'; then
            npm test
          else
            echo "No npm test script. Skipping. A DB-free npm test suite is being added separately."
          fi

      - name: Build
        run: npm run build

  # Prod runs Node 26. The main job stays on Node 22. This job only proves
  # `npm run backfill:battle-map -- --dry-run` actually starts under tsx's
  # CommonJS output (no top-level await) and can read a throwaway database.
  backfill:
    name: battle-map backfill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nextjs_space
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: questbound_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d questbound_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the service container. Not a repo secret.
      # Keep "prod" and "hpminioma" out of the URL (test:library / test:companions).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/questbound_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Seed one legacy battle map
        run: |
          cat > /tmp/seed-battle-map.cjs << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const state = {
            gridWidth: 10,
            gridHeight: 8,
            tokens: [{ id: 't1', label: 'Goblin', x: 1, y: 2, color: '#f00', size: 1 }],
            fog: ['0,0'],
            highlights: [],
          };
          (async () => {
            await prisma.campaign.create({
              data: {
                id: 'ci-battle-map',
                name: 'CI battle map',
                inviteCode: 'CIBTL',
                dmUserId: 'ci-dm',
                battleMapState: state,
              },
            });
            console.log('seeded ci-battle-map');
            await prisma.$disconnect();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/seed-battle-map.cjs

      - name: Dry-run backfill
        run: npm run backfill:battle-map -- --dry-run

      - name: Dry-run wrote nothing
        run: |
          cat > /tmp/check-battle-map.cjs << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const n = await prisma.battleMap.count();
            if (n !== 0) {
              console.error('dry-run created ' + n + ' BattleMap rows');
              process.exitCode = 1;
            } else {
              console.log('dry-run left BattleMap empty');
            }
            await prisma.$disconnect();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/check-battle-map.cjs

      - name: Run backfill
        run: npm run backfill:battle-map

      - name: Read back the copied map
        run: |
          cat > /tmp/read-battle-map.cjs << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const campaign = await prisma.campaign.findUnique({
              where: { id: 'ci-battle-map' },
              select: { battleMapState: true, battleMap: { include: { tokens: true, fogCells: true } } },
            });
            const state = campaign && campaign.battleMapState;
            const token = state && state.tokens && state.tokens[0];
            const row = campaign && campaign.battleMap;
            const ok = campaign
              && token && token.id === 't1' && token.label === 'Goblin'
              && row
              && row.tokens.length === 1
              && row.tokens[0].clientId === 't1'
              && row.tokens[0].x === 1
              && row.tokens[0].y === 2
              && row.fogCells.length === 1
              && row.fogCells[0].x === 0
              && row.fogCells[0].y === 0;
            if (!ok) {
              console.error('read-back failed', JSON.stringify(campaign));
              process.exitCode = 1;
            } else {
              console.log('read-back ok: legacy JSON kept, token and fog copied');
            }
            await prisma.$disconnect();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/read-battle-map.cjs
